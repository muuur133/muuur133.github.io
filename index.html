<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и данные</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <h2>Вход</h2>

  <!-- Кнопки входа -->
  <button id="github-login-btn">Войти через GitHub</button>
  <button id="google-login-btn">Войти через Google</button>

  <!-- Блок, который виден только после входа -->
  <div id="app-content" style="display:none; margin-top: 20px;">
    <!-- Кнопка выхода -->
    <button id="logout-btn">Выйти из аккаунта</button>

    <h3>Добавить запись</h3>
    <form id="add-form">
      <input type="text" id="item-name" placeholder="Название" required>
      <input type="text" id="item-desc" placeholder="Описание" required>
      <button type="submit">Добавить</button>
    </form>

    <h3>Список данных</h3>
    <ul id="items-list"></ul>
  </div>

  <!-- Подключаем ваш script2.js -->
  <script type="module" src="script2.js"></script>
</body>
</html>
