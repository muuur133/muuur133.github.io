<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Flashbank</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background-color: #000000; /* чёрный фон */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      button {
        padding: 20px 40px;
        font-size: 24px;
        color: #ffffff;
        background-color: #ff0000; /* красная кнопка для контраста */
        border: none;
        cursor: pointer;
        border-radius: 8px;
        transition: transform 0.2s;
      }

      button:hover {
        transform: scale(1.05);
      }

      #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #000000;
        font-size: 48px;
        font-weight: bold;
        opacity: 0; /* скрыто по умолчанию */
        transition: opacity 0.5s ease;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <button id="mainBtn">Нажать</button>
    <div id="message">flashbank</div>

    <script>
      const btn = document.getElementById('mainBtn');
      const message = document.getElementById('message');

      btn.addEventListener('click', () => {
        // 1. Сразу убираем кнопку из видимости
        btn.style.display = 'none';

        // 2. Сразу меняем фон на белый
        document.body.style.backgroundColor = '#ffffff';

        // 3. Через 3 секунды показываем надпись
        setTimeout(() => {
          message.style.opacity = '1';
        }, 3000);
      });
    </script>
  </body>
</html>
