<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Auth</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2 id="login-title">Вход</h2>

  <!-- Блок входа -->
  <div id="auth-block">
    <button id="github-login-btn">GitHub</button>
    <button id="google-login-btn">Google</button>
    <button id="email-toggle-btn">Войти через Email</button>

    <!-- Панель входа через Email (скрыта, показывается классом .open) -->
    <div id="email-panel">
      <h3>Вход через Email</h3>
      <input type="email" id="email-link-input" placeholder="Email" required>
      <input type="password" id="password-input" placeholder="Пароль" required>
      <button id="email-password-login-btn">Войти с паролем</button>
      <button id="passwordless-btn">Войти без пароля</button>
      <button id="email-register-btn">Зарегистрироваться</button>
      <p id="email-panel-msg"></p>
    </div>
  </div>

  <!-- Блок, который виден только после входа -->
  <div id="app-content">
    <button id="logout-btn">Выйти</button>

    <form id="add-form">
      <h3>Добавить запись</h3>
      <input type="text" id="item-name" placeholder="Название" required>
      <input type="text" id="item-desc" placeholder="Описание" required>
      <button type="submit">Добавить</button>
    </form>

    <h3>Список данных</h3>
    <ul id="items-list"></ul>
  </div>

  <script type="module" src="script2.js"></script>
</body>
</html>
